# /etc/nginx/sites-available/multimeteo
# MultiMeteo PWA - Configurazione Nginx per Ubuntu Server (Porta 8085)
# Host Tailscale: 100.115.154.44

server {
    listen 8085;
    server_name 100.115.154.44;

    # Percorso della cartella dist compilata
    root /var/www/multimeteo/dist;
    index index.html;

    # Ottimizzazione compressione HTTP
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Cache immutabile per asset con hash (CSS, JS, media)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Icone e manifest PWA (gestione cache breve per permettere aggiornamenti)
    location ~* \.(?:ico|png|svg|webmanifest)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # Service Worker e script di registrazione PWA: MAI in cache permanente
    location ~* (sw\.js|registerSW\.js|workbox-.*\.js)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        access_log off;
    }

    # Reverse Proxy per API Logger H24
    location /api/ {
        proxy_pass http://127.0.0.1:8086;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA Fallback su index.html per tutte le rotte virtuali
    location / {
        try_files $uri $uri/ /index.html;

        # Header di sicurezza moderni
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Disabilita log per file nascosti
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
